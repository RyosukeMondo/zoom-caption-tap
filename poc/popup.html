<!doctype html>
<meta charset="utf-8" />
<title>Zoom Caption Tap</title>
<style>
  body {
    width: 380px;
    margin: 0;
    padding: 12px;
    font: 13px/1.5 system-ui, sans-serif;
  }
  h1 { font-size: 14px; margin: 0 0 8px; }
  button { font: inherit; padding: 4px 10px; margin-right: 6px; }
  #status { color: #666; margin: 8px 0; }
  #transcript {
    max-height: 340px;
    overflow-y: auto;
    border-top: 1px solid #ddd;
    padding-top: 8px;
  }
  .line { margin-bottom: 6px; }
  .speaker { font-weight: 600; }
  .empty { color: #999; font-style: italic; margin-bottom: 6px; }
  .evt { font-family: ui-monospace, monospace; font-size: 11px; color: #555; }
</style>

<h1>Zoom Caption Tap (PoC)</h1>
<div>
  <button id="grant">Enable on zoom.us</button>
  <button id="panel">Open secretary</button>
  <button id="clear">Clear</button>
</div>
<div id="status">…</div>
<div id="transcript"></div>

<script src="popup.js"></script>
